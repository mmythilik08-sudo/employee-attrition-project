<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Prediction Result</h1>

    {% if prediction == "LEAVE" %}
        <h2 class="danger">{{ prediction }}</h2>
    {% else %}
        <h2 class="safe">{{ prediction }}</h2>
    {% endif %}

    <hr>

    <h3>Possible Reasons</h3>

    <ul>
        {% for reason in reasons %}
            <li>{{ reason }}</li>
        {% endfor %}
    </ul>

    <hr>

    <h3>Suggestions</h3>

    <ul>
        {% for suggestion in suggestions %}
            <li>{{ suggestion }}</li>
        {% endfor %}
    </ul>

    <br>

    <a href="/predict_page">
        <button class="btn">Predict Again</button>
    </a>

    <br><br>

    <a href="/home">
        <button class="btn">Home</button>
    </a>

</div>

</body>
</html>
